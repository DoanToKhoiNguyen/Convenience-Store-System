services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: convenience_store
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: convenience-store-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=convenience_store
      - DB_USERNAME=admin
      - DB_PASSWORD=admin123
    depends_on:
      - postgres
      - redis
    command: php artisan serve --host=0.0.0.0 --port=8000
volumes:
  pgdata:
